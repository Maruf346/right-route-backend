services:
  backend:
    image: ${IMAGE_URI:?IMAGE_URI is required}
    container_name: right_route_backend
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn right_route_config.wsgi:application
      --bind 0.0.0.0:8003
      --workers 3
      --threads 2
      --timeout 120
      --access-logfile -
      --error-logfile -
      "
    env_file:
      - production.env
    expose:
      - "8003"
    volumes:
      - staticfiles:/app/staticfiles
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8003/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: right_route_nginx
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - staticfiles:/app/staticfiles:ro
    restart: unless-stopped

volumes:
  staticfiles: